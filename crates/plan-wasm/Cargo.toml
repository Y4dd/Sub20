[package]
name = "sub20-plan-wasm"
description = "Sub20's planner built for WebAssembly, for Sub20 Lite in the browser."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sub20-core = { path = "../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
