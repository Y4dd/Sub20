name: Release

# A `v*` tag builds every installer and puts them on a draft release, with
# the update feed (latest.json) and SHA256SUMS.txt. Publishing the draft is
# done by hand on GitHub, after a look.
#
# Run it by hand (Actions → Release → Run workflow) to build everything
# without a release: the installers are kept on the run for a week.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version. Run npm run set-version first."
            exit 1
          fi
      - name: Create the draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists; adding to it."
          else
            node scripts/collect-release.mjs notes --version "$VERSION" > notes.md
            gh release create "v$VERSION" --draft --verify-tag --title "Sub20 $VERSION" --notes-file notes.md
          fi

  # One job per system: compile once, then package the lean download and the
  # one with FFmpeg inside from the same program. The program tells them
  # apart at run time by the sidecar beside it (`bundled` in src-tauri).
  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, bundles: "app,dmg" }
          # 22.04 so the AppImage runs on older glibc too.
          - { name: Linux x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb,rpm" }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Signing key
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so updates can't be signed."
            exit 1
          fi

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev             libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Saved from main only: a cache saved on a tag can't be read by the next
      # tag, while main's can be read by every tag. A dry run on main shortly
      # before tagging leaves a warm one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Compile
        run: npx tauri build --target ${{ matrix.target }} --no-bundle --config src-tauri/tauri.release.conf.json

      - name: Package the lean download
        shell: bash
        run: |
          npx tauri bundle --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          node scripts/collect-release.mjs collect --target ${{ matrix.target }} --flavor lean --out upload

      - name: FFmpeg
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.target }}

      - name: Package the download with FFmpeg
        shell: bash
        run: |
          # Start from an empty bundle folder, so nothing lean is collected twice.
          rm -rf "target/${{ matrix.target }}/release/bundle"
          npx tauri bundle --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}             --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.bundled.conf.json
          node scripts/collect-release.mjs collect --target ${{ matrix.target }} --flavor full --out upload

      - name: Upload to the draft
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.draft.outputs.version }}" $(ls upload/* | grep -v fragment-) --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ github.ref_type == 'tag' && 'upload/fragment-*.json' || 'upload/*' }}
          retention-days: 7

  feed:
    name: Update feed and checksums
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: fragments
      - run: node scripts/collect-release.mjs manifest --version ${{ needs.draft.outputs.version }} --in fragments --out feed
      - name: Upload to the draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.draft.outputs.version }}" feed/latest.json feed/SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: feed/*
          retention-days: 7
