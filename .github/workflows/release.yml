name: Release

# A `v*` tag builds every installer and puts them on a draft release, with
# the update feed (latest.json) and SHA256SUMS.txt. Publishing the draft is
# done by hand on GitHub, after a look.
#
# Run it by hand (Actions → Release → Run workflow) to build everything
# without a release: the installers are kept on the run for a week.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version. Run npm run set-version first."
            exit 1
          fi
      - name: Create the draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists; adding to it."
          else
            node scripts/collect-release.mjs notes --version "$VERSION" > notes.md
            gh release create "v$VERSION" --draft --verify-tag --title "Sub20 $VERSION" --notes-file notes.md
          fi

  build:
    name: ${{ matrix.host.name }} (${{ matrix.flavor }})
    needs: draft
    runs-on: ${{ matrix.host.os }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lean]
        host:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, bundles: "app,dmg" }
          # 22.04 so the AppImage runs on older glibc too.
          - { name: Linux x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb,rpm" }
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.host.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.host.target }}-${{ matrix.flavor }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: FFmpeg
        if: matrix.flavor == 'full'
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.host.target }}

      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUB20_BUNDLED: ${{ matrix.flavor == 'full' && '1' || '' }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so updates can't be signed."
            exit 1
          fi
          # An empty SUB20_BUNDLED still counts as set for option_env!.
          [ -n "$SUB20_BUNDLED" ] || unset SUB20_BUNDLED
          configs=(--config src-tauri/tauri.release.conf.json)
          if [ "${{ matrix.flavor }}" = full ]; then configs+=(--config src-tauri/tauri.bundled.conf.json); fi
          npx tauri build --target ${{ matrix.host.target }} --bundles ${{ matrix.host.bundles }} "${configs[@]}"

      - name: Collect
        run: node scripts/collect-release.mjs collect --target ${{ matrix.host.target }} --flavor ${{ matrix.flavor }} --out upload

      - name: Upload to the draft
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.draft.outputs.version }}" $(ls upload/* | grep -v fragment-) --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.host.target }}-${{ matrix.flavor }}
          path: ${{ github.ref_type == 'tag' && 'upload/fragment-*.json' || 'upload/*' }}
          retention-days: 7

  feed:
    name: Update feed and checksums
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: fragments
      - run: node scripts/collect-release.mjs manifest --version ${{ needs.draft.outputs.version }} --in fragments --out feed
      - name: Upload to the draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.draft.outputs.version }}" feed/latest.json feed/SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: feed/*
          retention-days: 7
