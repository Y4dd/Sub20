name: Bug report
description: Something doesn't work, or a result came out wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sub20 version
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - Linux
        - Sub20 Lite (in a browser)
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In the desktop app, open Settings, then About, press Copy diagnostics and paste here. It holds the versions, your system, GPU, the encoders found and the FFmpeg log of the video on screen, with your home folder written as ~. In Sub20 Lite, give your browser and device instead.
      render: text
  - type: textarea
    id: source
    attributes:
      label: About the source video
      description: Where it came from (NVIDIA app, OBS, phone, ...), its length, resolution and size. A link to a short clip that shows the problem helps most.
