[package]
name = "sub20"
description = "Sub20 — trim videos and fit them under a size limit."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "sub20_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sub20-core = { path = "../crates/core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "fs", "macros"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
base64 = "0.22"
clipboard-rs = "0.3"
tauri-plugin-drag = "2"
tauri-plugin-updater = "2"
os_info = { version = "3", default-features = false }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
# The HTTP client and TLS the updater already uses, for downloading FFmpeg.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
# The tray, Windows only (plan 7): on Linux it needs libayatana-appindicator,
# and GNOME shows no tray.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
# Whether the user is in a game before showing a notification (notify.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
